[server]
listen = 0.0.0.0
port = 8080
rate_limit_seconds = 300

# Innercity VPN: LibreMesh node IP is supplied by the client.
[wireguard.innercity]
interface = wg-innercity
config_path = /etc/wireguard/wg-innercity.conf
allowed_cidr = 10.66.0.0/24
reserved = 10.66.0.1

# WAN uplink tunnel: server allocates AllowedIPs from address_pool.
[wireguard.wan]
interface = wg-wan
config_path = /etc/wireguard/wg-wan.conf
address_pool = 10.99.0.0/24
reserved = 10.99.0.1

[watchdog]
peer_timeout_seconds = 600
check_interval_seconds = 30
state_path = /var/lib/freifunk-jena-wireguard-onboarder/state.json
